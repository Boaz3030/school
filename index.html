<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mijn Lamp</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
  :root { --aan: #ffd34d; --uit: #3a4256; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, sans-serif; color: #eef2ff;
    background: radial-gradient(circle at 30% 20%, #2b3a67, #0b1020 70%);
  }
  .kaart {
    width: min(340px, 90vw); padding: 32px 24px; text-align: center; border-radius: 28px;
    background: rgba(255,255,255,0.08); backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.18); box-shadow: 0 0 30px rgba(120,160,255,0.25);
  }
  h1 { margin: 0 0 24px; font-size: 22px; font-weight: 600; }
  .lamp { width: 120px; height: 120px; margin: 0 auto 28px; border-radius: 50%; background: var(--uit); transition: all .35s; }
  .aan .lamp { background: var(--aan); box-shadow: 0 0 60px 20px rgba(255,211,77,.55); }
  .knoppen { display: flex; gap: 14px; justify-content: center; }
  .knop { flex: 1; padding: 16px 0; font-size: 18px; font-weight: 700; letter-spacing: 1px;
    color: #fff; border-radius: 999px; cursor: pointer; transition: .2s;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.3); }
  .knop:disabled { opacity: .4; cursor: default; }
  .aanknop:not(:disabled):hover, .aan .aanknop { background: #2ecc71; box-shadow: 0 0 18px #2ecc71; }
  .uitknop:not(:disabled):hover, .kaart:not(.aan) .uitknop:not(:disabled) { background: #e74c3c; box-shadow: 0 0 18px #e74c3c; }
  .tekst { margin-top: 18px; font-size: 18px; opacity: .85; }
  .verbinding { margin-top: 10px; font-size: 13px; opacity: .6; }
</style>
</head>
<body>
  <div class="kaart" id="kaart">
    <h1>Mijn Lamp</h1>
    <div class="lamp"></div>
    <div class="knoppen">
      <button id="aan" class="knop aanknop" disabled>AAN</button>
      <button id="uit" class="knop uitknop" disabled>UIT</button>
    </div>
    <div class="tekst" id="tekst">Wachten op lamp...</div>
    <div class="verbinding" id="verbinding">Verbinden...</div>
  </div>
<script>
  const CODE = '78lb4mti';                 // gelijk aan de code in de sketch
  const ZET = 'esplamp/' + CODE + '/zet';
  const STATUS = 'esplamp/' + CODE + '/status';

  const knopAan = document.getElementById('aan');
  const knopUit = document.getElementById('uit');
  const kaart = document.getElementById('kaart');
  const tekst = document.getElementById('tekst');
  const verbinding = document.getElementById('verbinding');

  function toon(aan) {
    kaart.classList.toggle('aan', aan);
    tekst.textContent = aan ? 'Lamp aan' : 'Lamp uit';
  }

  const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
  client.on('connect', () => {
    verbinding.textContent = 'Verbonden met internet';
    knopAan.disabled = false; knopUit.disabled = false;
    client.subscribe(STATUS);
  });
  client.on('close', () => { verbinding.textContent = 'Geen verbinding'; knopAan.disabled = true; knopUit.disabled = true; });
  client.on('message', (onderwerp, data) => toon(data.toString() === 'aan'));

  knopAan.addEventListener('click', () => client.publish(ZET, 'aan'));
  knopUit.addEventListener('click', () => client.publish(ZET, 'uit'));
</script>
</body>
</html>
